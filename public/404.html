<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Page introuvable — Al Maârif Expertise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: #04162a;
        color: #fdfbf7;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        padding: 2rem;
      }
      .wrap { max-width: 44rem; margin: 0 auto; }
      .eyebrow {
        font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em;
        text-transform: uppercase; color: #d5b871; margin: 0 0 1.5rem;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400; font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.1; margin: 0 0 1.5rem;
      }
      p { color: rgba(220, 229, 239, 0.7); line-height: 1.7; margin: 0 0 2.5rem; }
      a.btn {
        display: inline-block; padding: 0.9rem 1.75rem; margin-right: 0.75rem;
        font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em;
        text-transform: uppercase; text-decoration: none;
      }
      .gold { background: #c19a45; color: #04162a; }
      .ghost { border: 1px solid rgba(213, 184, 113, 0.45); color: #f7f2e9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">Erreur 404</p>
      <h1>Page introuvable — Page not found</h1>
      <p>
        La page demandée n’existe pas ou a été déplacée.<br />
        The page you are looking for does not exist or has been moved.
      </p>
      <a class="btn gold" href="/fr/">Accueil</a>
      <a class="btn ghost" href="/en/">Home</a>
    </div>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Al Maârif Expertise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/fr/" />
    <link rel="alternate" hreflang="fr" href="/fr/" />
    <link rel="alternate" hreflang="en" href="/en/" />
    <link rel="alternate" hreflang="x-default" href="/fr/" />
    <link rel="icon" href="/favicon-32.png" type="image/png" />
    <meta http-equiv="refresh" content="0; url=/fr/" />
    <script>
      // Redirection vers la langue du navigateur (le repli est le français).
      (function () {
        var lang = (navigator.language || 'fr').slice(0, 2).toLowerCase()
        window.location.replace(lang === 'en' ? '/en/' : '/fr/')
      })()
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a1b33;
        color: #fcf9f3;
        font-family: Georgia, 'Times New Roman', serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.85rem;
      }
      a { color: #c69a3c; }
    </style>
  </head>
  <body>
    <p>Al Maârif Expertise : <a href="/fr/">Français</a> · <a href="/en/">English</a></p>
  </body>
